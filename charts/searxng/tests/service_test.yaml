suite: SearXNG service
templates:
  - templates/service.yaml
tests:
  - it: should create a Service on port 80
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-searxng
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: searxng
            app.kubernetes.io/instance: RELEASE-NAME
