suite: SearXNG secret
templates:
  - templates/secrets.yaml
tests:
  - it: should create a Secret with an inline value
    set:
      searxngSecret: inline-secret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-searxng-secret
      - equal:
          path: data.SEARXNG_SECRET
          value: aW5saW5lLXNlY3JldA==

  - it: should generate a Secret when no value is configured
    asserts:
      - isKind:
          of: Secret
      - matchRegex:
          path: data.SEARXNG_SECRET
          pattern: '^[A-Za-z0-9+/=]+$'

  - it: should not create a Secret when an existing Secret is configured
    set:
      existingSecret: external-searxng-secret
    asserts:
      - hasDocuments:
          count: 0
