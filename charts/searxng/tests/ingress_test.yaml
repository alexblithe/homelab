suite: SearXNG ingress
templates:
  - templates/ingress.yaml
tests:
  - it: should not create an Ingress by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create an Ingress when enabled
    set:
      ingress:
        enabled: true
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: RELEASE-NAME-searxng
      - equal:
          path: spec.rules[0].host
          value: searxng.local
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-searxng
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80
