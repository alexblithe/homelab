apiVersion: v2
name: rancher
description: A Helm chart for Rancher

type: application
version: 0.1.0
appVersion: "v2.13.3"

dependencies:
  - name: cert-manager
    version: v1.20.1
    repository: oci://quay.io/jetstack/charts
    condition: cert-manager.enabled
  - name: rancher
    version: v2.13.3
    repository: https://releases.rancher.com/server-charts/latest
    condition: rancher.enabled