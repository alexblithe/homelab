suite: postgresql cluster
templates:
  - charts/cluster/templates/cluster.yaml
tests:
  - it: should render postgresql cluster with default values
    asserts:
      - isKind:
          of: Cluster
      - isAPIVersion:
          of: postgresql.cnpg.io/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cluster
      - equal:
          path: spec.instances
          value: 2
      - equal:
          path: spec.imageName
          value: ghcr.io/cloudnative-pg/postgresql:16

  - it: should allow overriding cluster instances and postgresql version
    set:
      cluster:
        cluster:
          instances: 3
        version:
          postgresql: "17"
    asserts:
      - equal:
          path: spec.instances
          value: 3
      - equal:
          path: spec.imageName
          value: ghcr.io/cloudnative-pg/postgresql:17
