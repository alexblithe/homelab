suite: openwebui secrets
templates:
  - templates/secrets.yaml
tests:
  - it: should render secret with defaults
    asserts:
      - isKind:
          of: Secret
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: openwebui-openai-api-keys
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data["open-ai-keys"]
          value: null

  - it: should render base64-encoded single openai api key
    set:
      openwebui:
        openaiApiKeys:
          - "sk-single-key"
    asserts:
      - equal:
          path: data["open-ai-keys"]
          value: "c2stc2luZ2xlLWtleQ=="

  - it: should render base64-encoded comma-separated multiple openai api keys
    set:
      openwebui:
        openaiApiKeys:
          - "sk-key-1"
          - "sk-key-2"
    asserts:
      - equal:
          path: data["open-ai-keys"]
          value: "c2sta2V5LTEsc2sta2V5LTI="
