[project]
name = "homelab-tests"
version = "0.1.0"
description = "Integration and unit tests for homelab Helm charts"
requires-python = ">=3.11"

dependencies = [
  "pytest>=8.0",
  "testcontainers>=4.0",
  "testcontainers[k3s]>=4.0",
  "kubernetes>=31.0",
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.pyrefly]
project_includes = ["tests"]
